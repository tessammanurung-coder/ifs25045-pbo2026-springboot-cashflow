spring:
  application:
    name: ifs25045-pbo2026-springboot-cashflow
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:8080}
  # Kompresi respons: bundel JS/CSS Vaadin berukuran besar; mengurangi byte transfer (FCP/LCP).
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
